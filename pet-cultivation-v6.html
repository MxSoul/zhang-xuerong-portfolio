const effectCache = new WeakMap();
function surface(w, h) {
  const node = document.createElement('canvas');
  node.width = w;
  node.height = h;
  return node;
}
function pointAt(points, u, loop = false) {
  const count = points.length;
  const pos = loop ? ((u % 1 + 1) % 1) * count : Math.min(1, Math.max(0, u)) * (count - 1);
  const i = Math.min(Math.floor(pos), count - 1), a = points[i], b = points[(i + 1) % count];
  return {x: a.x + (b.x - a.x) * (pos - i), y: a.y + (b.y - a.y) * (pos - i), front: a.front};
}
function pathFor(points) {
  const path = new Path2D();
  path.moveTo(points[0].x, points[0].y);
  for (let i = 1; i < points.length; i++) path.lineTo(points[i].x, points[i].y);
  return path;
}
function makeSpark(rgb) {
  const node = surface(48, 48), g = node.getContext('2d');
  const fade = g.createRadialGradient(24, 24, 0, 24, 24, 24);
  fade.addColorStop(0, 'rgba(255,255,240,1)');
  fade.addColorStop(.12, 'rgba(' + rgb + ',.95)');
  fade.addColorStop(.25, 'rgba(' + rgb + ',.48)');
  fade.addColorStop(.6, 'rgba(' + rgb + ',.13)');
  fade.addColorStop(1, 'rgba(' + rgb + ',0)');
  g.fillStyle = fade;
  g.fillRect(0, 0, 48, 48);
  return node;
}
function floorMask() {
  const mask = new Path2D();
  mask.rect(0, 522, SCENE_W, 228);
  mask.moveTo(223,592); mask.lineTo(601,592); mask.quadraticCurveTo(628,592,628,620);
  mask.lineTo(642,642); mask.lineTo(628,667); mask.quadraticCurveTo(628,693,600,693);
  mask.lineTo(223,693); mask.quadraticCurveTo(199,693,199,666); mask.lineTo(185,643);
  mask.lineTo(199,619); mask.quadraticCurveTo(199,592,223,592); mask.closePath();
  for (const [x,r] of [[156,2.5],[165,4],[176,4.5],[656,4.5],[666,4],[674,2.5]]) {
    mask.moveTo(x,643-r); mask.lineTo(x+r,643); mask.lineTo(x,643+r); mask.lineTo(x-r,643); mask.closePath();
  }
  mask.rect(826,522,412,205); mask.rect(1267,522,57,30);
  return mask;
}
function cacheFor(geometry) {
  if (effectCache.has(geometry)) return effectCache.get(geometry);
  const mask = floorMask();
  // The silk paths, their soft edges and the reflection never move as a whole.
  // Rasterise them once, then animate the highlights along the original paths.
  const beam = surface(280, 382), g = beam.getContext('2d');
  g.translate(-267, -371);
  g.save(); g.beginPath(); g.rect(353,373,106,176); g.clip();
  for (const route of geometry.flow) {
    const path = pathFor(route);
    g.strokeStyle = 'rgba(255,222,146,.09)'; g.lineWidth = 5.3; g.stroke(path);
    g.strokeStyle = 'rgba(255,246,198,.28)'; g.lineWidth = 1;
    g.shadowColor = 'rgba(255,216,133,.65)'; g.shadowBlur = 3; g.stroke(path); g.shadowBlur = 0;
  }
  g.restore();
  g.save(); g.clip(mask,'evenodd');
  const fade = g.createLinearGradient(0,550,0,750);
  fade.addColorStop(0,'rgba(255,233,174,.26)'); fade.addColorStop(.55,'rgba(255,228,159,.085)'); fade.addColorStop(1,'rgba(255,223,154,0)');
  g.strokeStyle = fade; g.shadowColor = 'rgba(255,223,154,.4)'; g.shadowBlur = 4;
  for (let j=0;j<7;j++) {
    g.beginPath();
    for(let y=550;y<=752;y+=4) {
      const u=(y-550)/202, x=407+(j-3)*9*(1+3.6*u*u)+Math.sin(u*10+j);
      if(y===550) g.moveTo(x,y); else g.lineTo(x,y);
    }
    g.lineWidth=j%2?.75:1.15; g.stroke();
  }
  const horizon = g.createLinearGradient(280,548,535,548);
  horizon.addColorStop(0,'rgba(255,232,158,0)'); horizon.addColorStop(.45,'rgba(255,248,201,.82)');
  horizon.addColorStop(.58,'rgba(255,250,211,.85)'); horizon.addColorStop(1,'rgba(255,232,158,0)');
  g.strokeStyle=horizon; g.lineWidth=1.25; g.beginPath(); g.moveTo(280,548); g.lineTo(535,548); g.stroke();
  g.restore();
  const result={mask,beam,gold:makeSpark('255,219,138'),white:makeSpark('255,244,210'),blue:makeSpark('192,224,255')};
  effectCache.set(geometry,result);
  return result;
}
function renderEffects(ctx, base, geometry, time, opts = {}, assets = {}) {
  const elapsed=Math.max(0,time), progress=(elapsed % 8)/8, phase=progress*TAU;

  ctx.drawImage(base,0,0,SCENE_W,SCENE_H);
  const frames=assets.floorFrames;
  if(opts.floor!==false && frames?.length) {
    const index=Math.floor((progress*6 % 1)*frames.length);
    ctx.save(); ctx.clip(mask,'evenodd'); ctx.globalAlpha=.8;
    ctx.drawImage(frames[index],0,615,865,155);
    ctx.translate(SCENE_W,0); ctx.scale(-1,1); ctx.globalAlpha=.66;
    ctx.drawImage(frames[(index+6)%frames.length],0,637,720,137); ctx.restore();

      if(Math.hypot(x-410,y-300)<106 || (x>350 && x<465 && y>370)) continue;
      spark(x,y,3.9,(.32+.68*(.5+.5*Math.sin(phase*2+k))**2)*.63,white);
    }
    ctx.save();ctx.clip(mask,'evenodd');
    for(let k=0;k<35;k++){
      const seed=(k*.754877666)%1,u=(progress+seed)%1;
      spark(15+seed*1304+23*Math.sin(phase+k*.8),735-u*117+9*Math.sin(phase+k),4.7,Math.sin(Math.PI*u)**.75*(.3+(k%3)*.12),white);
    }
    ctx.restore();
  }
  if(opts.beam!==false) {
    ctx.globalAlpha=1; ctx.drawImage(beam,267,371);
    ctx.strokeStyle='#fff4ce';ctx.lineCap='round';ctx.lineWidth=1.15;
    geometry.flow.forEach((route,j)=>{
      for(let k=0;k<3;k++){
        const u=(progress*4+k/3-j*.055+1.11)%1;
        const p=pointAt(route,u), tail=pointAt(route,Math.max(0,u-.075));
        const a=Math.sin(Math.PI*u)**.6*(k===0?.76:.45);
        ctx.globalAlpha=a*.78;ctx.beginPath();ctx.moveTo(tail.x,tail.y);ctx.lineTo(p.x,p.y);ctx.stroke();
        spark(p.x,p.y,4,a,white);
      }
    });
    for(const pin of geometry.flowPins) {
      const pulse=.5+.5*Math.cos(TAU*(pin.u-progress*4+pin.track*.055-.11));
      spark(pin.x,pin.y,7,.06+.3*pulse**9);
    }
    ctx.save(); ctx.clip(mask,'evenodd');
    for(let j=0;j<7;j++){
      const u=(progress*4+j*.157)%1;
      spark(407+(j-3)*9*(1+3.6*u*u),550+u*202,3,.2*Math.sin(Math.PI*u),white);
    }
    ctx.strokeStyle='#ffedb5';
    for(const sign of [-1,1])for(let layer=0;layer<2;layer++){
      const edge=sign<0?363:451,h=15+3*Math.sin(phase*3+sign)+layer*2.5,w=24+layer*10;
      ctx.globalAlpha=.5/(layer+1);ctx.lineWidth=layer===0?1.25:.75;
      ctx.beginPath();ctx.moveTo(edge,548);ctx.bezierCurveTo(edge+sign*10,545,edge+sign*9,548-h,edge+sign*w,548-h);
      ctx.bezierCurveTo(edge+sign*(w+20),548-h,edge+sign*(w+1),548,edge+sign*(w+41),547);ctx.stroke();
    }
    ctx.save();ctx.translate(407,548);ctx.scale(3,.25);spark(0,0,24,.45+.1*Math.sin(phase*4)**2);ctx.restore();
    for(let k=0;k<16;k++){
      const u=(progress*5+k*.137)%1;
      spark(407+(k%2?1:-1)*(25+u*(30+k%4*4)),547-Math.sin(Math.PI*u)*(9+k%4*4),3.7,Math.sin(Math.PI*u)*.72,white);

  }
  if(opts.orbit!==false) {

    for(let k=0;k<2;k++) {

      const trail=Array.from({length:49},(_,n)=>pointAt(geometry.orbit,head-n/192,true));

      for(let group=7;group>=0;group--){
        const path=new Path2D(), start=group*6, fade=1-(start+2)/49;

        for(let i=start;i<=start+6;i++){

    }
  }
  ctx.restore();
  return {elapsed,flowActive:true};
}

 function fitSurface(){
  const box=canvas.getBoundingClientRect();
  if(!box.width || !box.height) return;
  const ratio=Math.min(window.devicePixelRatio || 1,2);
  const scale=Math.min(1,ratio*box.width/SCENE_W,ratio*box.height/SCENE_H);
